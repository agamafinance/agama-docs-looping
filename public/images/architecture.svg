<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" width="1160" height="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c2d6cb"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fd9b8"/></marker>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
</defs>

<rect width="1160" height="740" fill="#254839"/>
<rect width="1160" height="740" fill="url(#grid)"/>
<rect x="22" y="22" width="1116" height="696" fill="none" stroke="#ffffff" stroke-opacity="0.10" rx="6"/>

<text x="56" y="64" fill="#ffffff" font-size="24" font-weight="700">Agama, end to end</text>
<text x="56" y="86" fill="#c2d6cb" font-size="12.5">USDC in, agUSD out, sagUSD for the yield. The Allocation Engine holds nothing and enforces the limits.</text>

<!-- ENTRY -->
<rect x="150" y="120" width="420" height="60" rx="12" fill="#2e4a3c" stroke="#6e8c7d" stroke-width="1.5"/>
<text x="360" y="145" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">LP deposits USDC</text>
<text x="360" y="165" fill="#c2d6cb" font-size="11" text-anchor="middle">from a Stellar wallet, MoneyGram cash, or CCTP from another chain</text>

<path d="M360 180 L360 208" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<!-- VAULT -->
<rect x="150" y="210" width="420" height="86" rx="12" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
<text x="360" y="237" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Vault Contract</text>
<text x="360" y="259" fill="#c2d6cb" font-size="11.5" text-anchor="middle">deposit() mints agUSD 1:1 against USDC, and holds the idle USDC</text>
<text x="360" y="279" fill="#9fd9b8" font-size="11.5" font-weight="700" text-anchor="middle">two-step FIFO withdrawal queue, no priority and no way around it</text>

<path d="M245 296 L245 324" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<!-- TOKENS -->
<rect x="150" y="326" width="190" height="92" rx="12" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
<text x="245" y="352" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">agUSD</text>
<text x="245" y="373" fill="#c2d6cb" font-size="10.5" text-anchor="middle">SEP-41, minted 1:1</text>
<text x="245" y="390" fill="#c2d6cb" font-size="10.5" text-anchor="middle">no transfer restriction</text>
<text x="245" y="407" fill="#c2d6cb" font-size="10.5" text-anchor="middle">mint and burn: Vault only</text>

<rect x="380" y="326" width="190" height="92" rx="12" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
<text x="475" y="352" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">sagUSD</text>
<text x="475" y="373" fill="#c2d6cb" font-size="10.5" text-anchor="middle">share-based staking</text>
<text x="475" y="390" fill="#c2d6cb" font-size="10.5" text-anchor="middle">DeFindex-compatible</text>
<text x="475" y="407" fill="#c2d6cb" font-size="10.5" text-anchor="middle">the rate rises, no rebase</text>

<path d="M340 378 L378 378" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="359" y="367" fill="#9fd9b8" font-size="10" font-weight="700" text-anchor="middle">stake</text>

<!-- VAULT TO ENGINE, DOWN THE LEFT MARGIN -->
<path d="M150 253 L108 253 L108 506 L146 506" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="98" y="380" fill="#c2d6cb" font-size="10.5" text-anchor="middle" transform="rotate(-90 98 380)">USDC released only if allocate() passes</text>

<!-- ALLOCATION ENGINE -->
<rect x="150" y="448" width="420" height="116" rx="12" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
<text x="360" y="475" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Allocation Engine</text>
<text x="360" y="497" fill="#c2d6cb" font-size="11.5" text-anchor="middle">admin-directed in V1: the Curator picks the pool and the size,</text>
<text x="360" y="514" fill="#c2d6cb" font-size="11.5" text-anchor="middle">and the Engine either allows the call or reverts it</text>
<text x="360" y="540" fill="#9fd9b8" font-size="11.5" font-weight="700" text-anchor="middle">one uniform adapter per pool type</text>

<path d="M250 564 L250 592" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M470 564 L470 592" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<!-- TARGETS -->
<rect x="150" y="594" width="200" height="86" rx="12" fill="#2e4a3c" stroke="#6e8c7d" stroke-width="1.5"/>
<text x="250" y="621" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">Credit vaults</text>
<text x="250" y="641" fill="#c2d6cb" font-size="10.5" text-anchor="middle">six live on testnet, curated</text>
<text x="250" y="658" fill="#c2d6cb" font-size="10.5" text-anchor="middle">with Qiro and Tenka</text>

<rect x="370" y="594" width="200" height="86" rx="12" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5"/>
<text x="470" y="621" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">Etherfuse Stablebonds</text>
<text x="470" y="641" fill="#9fd9b8" font-size="10.5" text-anchor="middle">government bond RWA,</text>
<text x="470" y="658" fill="#9fd9b8" font-size="10.5" text-anchor="middle">instant on-chain redemption</text>

<!-- ORACLE -->
<rect x="660" y="210" width="440" height="86" rx="12" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
<text x="880" y="237" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Oracle Adapter</text>
<text x="880" y="259" fill="#c2d6cb" font-size="11.5" text-anchor="middle">three feeds, each with its own staleness and deviation bound</text>
<text x="880" y="279" fill="#9fd9b8" font-size="11.5" font-weight="700" text-anchor="middle">a stale feed errors, it never reads as fresh</text>

<path d="M658 262 L574 262" stroke="#c2d6cb" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="616" y="250" fill="#c2d6cb" font-size="10" text-anchor="middle">validated NAV</text>

<!-- GUARDS PANEL -->
<rect x="660" y="380" width="440" height="184" rx="12" fill="#2a4437" stroke="#9fd9b8" stroke-width="1.5"/>
<text x="686" y="410" fill="#9fd9b8" font-size="11" font-weight="700" letter-spacing="1.1">CHECKED ON-CHAIN BY allocate()</text>
<text x="686" y="441" fill="#ffffff" font-size="12.5">1 &#183; cap per pool</text>
<text x="686" y="465" fill="#ffffff" font-size="12.5">2 &#183; cap per originator</text>
<text x="686" y="489" fill="#ffffff" font-size="12.5">3 &#183; cap per jurisdiction</text>
<text x="686" y="513" fill="#ffffff" font-size="12.5">4 &#183; minimum idle USDC reserve floor</text>
<text x="686" y="543" fill="#c2d6cb" font-size="11.5">Any one of them failing reverts the whole call.</text>

<path d="M658 472 L574 472" stroke="#9fd9b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>

<!-- YIELD NOTE -->
<rect x="660" y="594" width="440" height="86" rx="12" fill="#2a4437" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1"/>
<text x="686" y="622" fill="#ffffff" font-size="12.5" font-weight="700">Yield reaches holders one way</text>
<text x="686" y="644" fill="#c2d6cb" font-size="11.5">Repayments return to the Vault, then distribute_yield() raises</text>
<text x="686" y="663" fill="#c2d6cb" font-size="11.5">the sagUSD exchange rate. No claim step, no rebase.</text>

</svg>
